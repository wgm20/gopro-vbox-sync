name: Windows tests and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        video-tools: [current, legacy-7.1.1]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13.15'
      - run: python -m pip install -r requirements-build.txt
      - name: Set up verified video tools
        run: |
          python -c "from goprovbox.distribution import download_tools; download_tools()"
          python -c "from goprovbox.distribution import tools_directory; print(tools_directory())" >> $env:GITHUB_PATH
      - name: Exercise FFmpeg 7 compatibility
        if: matrix.video-tools == 'legacy-7.1.1'
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'ffmpeg-7.1.1.zip'
          Invoke-WebRequest 'https://github.com/GyanD/codexffmpeg/releases/download/7.1.1/ffmpeg-7.1.1-essentials_build.zip' -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne '04861d3339c5ebe38b56c19a15cf2c0cc97f5de4fa8910e4d47e5e6404e4a2d4') { throw 'Legacy tools integrity check failed' }
          $destination = Join-Path $env:RUNNER_TEMP 'legacy-video-tools'
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          $bin = Join-Path $destination 'ffmpeg-7.1.1-essentials_build/bin'
          "GOPROVBOX_FFMPEG=$bin/ffmpeg.exe" >> $env:GITHUB_ENV
          "GOPROVBOX_FFPROBE=$bin/ffprobe.exe" >> $env:GITHUB_ENV
          $bin >> $env:GITHUB_PATH
      - run: python -m unittest discover -s tests -v

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13.15'
      - name: Check release version
        run: python -c "import os; from goprovbox import __version__; assert os.environ['GITHUB_REF_NAME'] == 'v' + __version__"
      - run: python -m pip install -r requirements-build.txt
      - run: ./scripts/bootstrap_inno.ps1
      - run: python -c "from goprovbox.distribution import download_tools; download_tools()"
      - run: python scripts/build_release.py
      - run: python scripts/test_installer.py
      - name: Publish tested beta
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:GITHUB_REF_NAME" release-output/* --verify-tag --prerelease --title "GoPro VBOX Sync $env:GITHUB_REF_NAME (beta)" --notes-file release/notes.md

name: Windows tests and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.15'
      - run: python -m pip install -r requirements-build.txt
      - name: Set up verified video tools
        run: |
          python -c "from goprovbox.distribution import download_tools; download_tools()"
          python -c "from goprovbox.distribution import tools_directory; print(tools_directory())" >> $env:GITHUB_PATH
      - run: python -m unittest discover -s tests -v

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.15'
      - name: Check release version
        run: python -c "import os; from goprovbox import __version__; assert os.environ['GITHUB_REF_NAME'] == 'v' + __version__"
      - run: python -m pip install -r requirements-build.txt
      - run: ./scripts/bootstrap_inno.ps1
      - run: python -c "from goprovbox.distribution import download_tools; download_tools()"
      - run: python scripts/build_release.py
      - run: python scripts/test_installer.py
      - name: Publish tested beta
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:GITHUB_REF_NAME" release-output/* --verify-tag --prerelease --title "GoPro VBOX Sync $env:GITHUB_REF_NAME (beta)" --notes-file release/notes.md
